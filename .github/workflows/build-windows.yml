name: Reusable Windows Build

on:
  workflow_call:
    inputs:
      source_ref:
        required: true
        type: string
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        required: false
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: false

permissions:
  contents: read

jobs:
  build:
    name: Build (windows)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # WiX 只接受纯数字版本；NSIS 仍使用完整 SemVer。
      - name: Prepare MSI version override
        shell: bash
        run: |
          node -e "
            const fs = require('fs');
            const rawVer = require('./src-tauri/tauri.conf.json').version;
            const cleanVer = rawVer.replace(/[-+].*$/, '');
            fs.writeFileSync('release-msi-version.tmp.json', JSON.stringify({ bundle: { windows: { wix: { version: cleanVer } } } }));
            console.log('MSI version override ->', cleanVer);
          "

      - name: Build packages
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --config release-msi-version.tmp.json

      - name: Check internal plugin types
        run: pnpm -r --filter './packages/*' typecheck

      - name: Test Windows backend
        shell: pwsh
        run: |
          $testLog = Join-Path $env:RUNNER_TEMP 'wanglab-backend-tests.log'
          cargo test --manifest-path src-tauri/Cargo.toml --release --locked --lib -- --test-threads=1 2>&1 | Tee-Object -FilePath $testLog
          $testExit = $LASTEXITCODE
          if ($testExit -ne 0) {
            $detail = (Get-Content $testLog -Tail 120) -join "`n"
            $detail = $detail.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Windows backend tests::$detail"
            exit $testExit
          }

      - name: Test frontend and internal plugins
        run: pnpm test --run

      - name: Verify upgrade and Desktop readiness
        shell: pwsh
        run: |
          $fixture = Join-Path $env:RUNNER_TEMP 'wanglab-previous-core.zip'
          Invoke-WebRequest 'https://github.com/ArtisanMinds/WanglabHarnessPakege/releases/download/wanglab-core-dsh-0.1.2-rc.1/deepseek-harness-pkg-windows.zip' -OutFile $fixture
          $env:WANGLAB_UPGRADE_CORE_ZIP = $fixture
          $env:WANGLAB_TEST_CORE_URL = 'https://github.com/ArtisanMinds/WanglabHarnessPakege/releases/download/wanglab-core-dsh-0.1.2-rc.1-desktop-0.2.2/deepseek-harness-pkg-windows.zip'
          cargo test --manifest-path src-tauri/Cargo.toml --release --locked --lib windows_upgrade_startup -- --ignored --nocapture --test-threads=1
          if ($LASTEXITCODE -ne 0) {
            if (Test-Path $env:GITHUB_STEP_SUMMARY) {
              $detail = (Get-Content $env:GITHUB_STEP_SUMMARY -Raw).Replace("`r", ' ').Replace("`n", ' ')
              Write-Output "::error file=src-tauri/src/service/workflow/startup_smoke.rs::$detail"
            }
            exit $LASTEXITCODE
          }

      - name: Upload build outputs
        uses: actions/upload-artifact@v6
        with:
          name: release-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 7
