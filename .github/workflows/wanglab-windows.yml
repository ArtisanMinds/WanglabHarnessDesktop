name: Build Wanglab Windows Release

on:
  push:
    branches:
      - wanglab/0.2.0-localization
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  supersede:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Cancel superseded Windows builds
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          outdated=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/wanglab-windows.yml/runs" \
            -f branch="$GITHUB_REF_NAME" -f per_page=100 \
            --jq ".workflow_runs[] | select(.run_number < $GITHUB_RUN_NUMBER and .status != \"completed\") | .id")
          while read -r run_id; do
            [[ -n "$run_id" ]] || continue
            if ! gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/cancel" --silent; then
              test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" --jq '.status')" = completed
            fi
          done <<< "$outdated"

  build-windows:
    needs: supersede
    uses: ./.github/workflows/build-windows.yml
    with:
      source_ref: ${{ github.sha }}
    secrets: inherit

  publish:
    needs: build-windows
    runs-on: ubuntu-latest
    steps:
      - name: Check release source is current
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          current=$(gh api --method GET "repos/$GITHUB_REPOSITORY/commits" -f sha="$GITHUB_REF_NAME" -f per_page=1 --jq '.[0].sha')
          test "$current" = "$GITHUB_SHA" || { echo 'A newer source commit superseded this build'; exit 1; }

      - name: Checkout release metadata
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download Windows packages
        uses: actions/download-artifact@v7
        with:
          name: release-windows
          path: release-assets

      - name: Publish Wanglab Desktop release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          APP_VERSION="$(node -p 'require("./package.json").version')"
          RELEASE_TAG="wanglab-v$APP_VERSION"
          if EXISTING_COMMIT="$(gh release view "$RELEASE_TAG" --json targetCommitish --jq '.targetCommitish' 2>/dev/null)"; then
            test "$EXISTING_COMMIT" = "$GITHUB_SHA" || { echo 'Refusing to overwrite a release from another commit'; exit 1; }
          else
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --title "Wanglab Harness Desktop $APP_VERSION" --notes-file ".github/release-notes/wanglab-$APP_VERSION.md"
          fi
          mapfile -d '' assets < <(find release-assets -type f -name '*.exe' -print0)
          test "${#assets[@]}" -gt 0
          gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
