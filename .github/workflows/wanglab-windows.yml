name: Build Wanglab Windows Release

on:
  push:
    branches:
      - wanglab/0.2.0-localization
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    uses: ./.github/workflows/build-windows.yml
    with:
      source_ref: ${{ github.sha }}
    secrets: inherit

  publish:
    needs: build-windows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release metadata
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download Windows packages
        uses: actions/download-artifact@v7
        with:
          name: release-windows
          path: release-assets

      - name: Publish Wanglab Desktop release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          APP_VERSION="$(node -p 'require("./package.json").version')"
          RELEASE_TAG="wanglab-v$APP_VERSION"
          if EXISTING_COMMIT="$(gh release view "$RELEASE_TAG" --json targetCommitish --jq '.targetCommitish' 2>/dev/null)"; then
            test "$EXISTING_COMMIT" = "$GITHUB_SHA" || { echo 'Refusing to overwrite a release from another commit'; exit 1; }
          else
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --title "Wanglab Harness Desktop $APP_VERSION" --notes 'Synced with DeepSeek Harness Desktop v0.11.1, including native module compatibility checks, pet click-through protection, panel controls, and dismissible update notifications. Reuses the verified Node 22.22.0 Core from Wanglab 0.3.0. Preserves the inline bilingual pet market, 25%-200% sizing, model supplier routes, and self-hosted updates.'
          fi
          mapfile -d '' assets < <(find release-assets -type f -name '*.exe' -print0)
          test "${#assets[@]}" -gt 0
          gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
