name: Build Wanglab Windows Release

on:
  push:
    branches:
      - wanglab/0.1.0-localization
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    uses: ./.github/workflows/build-windows.yml
    with:
      source_ref: ${{ github.sha }}
    secrets: inherit

  publish:
    needs: build-windows
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows packages
        uses: actions/download-artifact@v7
        with:
          name: release-windows
          path: release-assets

      - name: Publish Wanglab Desktop release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: wanglab-v0.1.0
        run: |
          gh release delete "$RELEASE_TAG" --cleanup-tag --yes || true
          gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --title "Wanglab Harness Desktop 0.1.0"
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
